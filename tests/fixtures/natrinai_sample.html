<html><body>
<p>நூல்</p>
<p>1 குறிஞ்சி - கபிலர்</p>
<p>நின்ற சொல்லர் நீடுதோறு இனியர்<br>என்றும் என் தோள் பிரிபு அறியலரே</p>
<p><small>பிரிவு உணர்த்திய தோழிக்குத் தலைவி சொல்லியது</small></p>
<p>2 பாலை - (?)</p>
<p>அழுந்துபட வீழ்ந்த பெருந் தண் குன்றத்து<br>ஒலி வல் ஈந்தின் உலவைஅம் காட்டு</p>
<p>4 நெய்தல் - அம்மூவனார்</p>
<p>கானல் அம் சிறுகுடிக் கடல் மேம் பரதவர்</p>
</body></html>
