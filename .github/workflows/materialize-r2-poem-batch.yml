name: Materialize R2 poem-work batch
on:
  push:
    branches:
      - research/classical-tamil-concept-matrix-r2
    paths:
      - 'research/production/natrinai/review-specs/*.json'
      - 'research/production/aingurunuru/review-specs/*.json'
      - 'research/production/akananuru/review-specs/*.json'
      - 'research/production/kalittokai/review-specs/*.json'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Materialize changed specs
        run: |
          git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'research/production/natrinai/review-specs/*.json' 'research/production/aingurunuru/review-specs/*.json' 'research/production/akananuru/review-specs/*.json' 'research/production/kalittokai/review-specs/*.json' > /tmp/r2-poem-specs.txt
          while IFS= read -r spec; do
            [ -z "$spec" ] || python3 scripts/materialize_r2_poem_batch.py --root . --spec "$spec"
          done < /tmp/r2-poem-specs.txt
      - name: Validate prefixes
        run: |
          python3 scripts/validate_r2_poem_production.py --root . --work natrinai --records 400
          python3 scripts/validate_r2_poem_production.py --root . --work aingurunuru --records 500
          python3 scripts/validate_r2_poem_production.py --root . --work akananuru --records 400
          python3 scripts/validate_r2_poem_production.py --root . --work kalittokai --records 150
      - name: Commit generated records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/production/natrinai/records/*.json research/observations/natrinai/r2-production.ndjson research/production/aingurunuru/records/*.json research/observations/aingurunuru/r2-production.ndjson research/production/akananuru/records/*.json research/observations/akananuru/r2-production.ndjson research/production/kalittokai/records/*.json research/observations/kalittokai/r2-production.ndjson
          if ! git diff --cached --quiet; then
            git commit -m "research: materialize Natrinai R2 production"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
