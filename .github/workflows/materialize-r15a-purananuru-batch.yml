name: Materialize R1.5A Purananuru batch

on:
  push:
    branches:
      - research/classical-tamil-concept-matrix-r1.5a
    paths:
      - 'research/production/purananuru/review-specs/*.json'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Materialize reviewed batch
        run: |
          python3 scripts/materialize_r15a_purananuru_batch.py --root . --spec research/production/purananuru/review-specs/003-010.json
      - name: Validate production prefix
        run: python3 scripts/validate_r15_purananuru_production.py --root .
      - name: Run regression suite
        run: pytest -q
      - name: Commit reviewed records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/production/purananuru/records/003.json research/production/purananuru/records/004.json research/production/purananuru/records/005.json research/production/purananuru/records/006.json research/production/purananuru/records/007.json research/production/purananuru/records/008.json research/production/purananuru/records/009.json research/production/purananuru/records/010.json
          if git diff --cached --quiet; then
            echo "No generated record changes."
          else
            git commit -m "research: review Purananuru 003-010"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
