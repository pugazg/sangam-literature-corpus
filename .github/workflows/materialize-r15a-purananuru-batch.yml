name: Materialize R1.5A Purananuru batch

on:
  push:
    branches:
      - research/classical-tamil-concept-matrix-r1.5a
    paths:
      - 'research/production/purananuru/review-specs/*.json'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Materialize changed reviewed specs
        run: |
          git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'research/production/purananuru/review-specs/*.json' > /tmp/r15a-specs.txt
          if [ ! -s /tmp/r15a-specs.txt ]; then
            echo "No changed review specs."
            exit 0
          fi
          while IFS= read -r spec; do
            python3 scripts/materialize_r15a_purananuru_batch_driver.py --root . --spec "$spec"
          done < /tmp/r15a-specs.txt
      - name: Validate production prefix
        run: python3 scripts/validate_r15_purananuru_production.py --root .
      - name: Run regression suite
        run: pytest -q
      - name: Commit reviewed records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/production/purananuru/records/*.json
          if git diff --cached --quiet; then
            echo "No generated record changes."
          else
            first=$(git diff --cached --name-only | sed -n 's#research/production/purananuru/records/\([0-9][0-9][0-9]\)\.json#\1#p' | head -1)
            last=$(git diff --cached --name-only | sed -n 's#research/production/purananuru/records/\([0-9][0-9][0-9]\)\.json#\1#p' | tail -1)
            git commit -m "research: review Purananuru ${first}-${last}"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
