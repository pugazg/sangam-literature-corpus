name: Research R1, R1.5 and R1.5A verification

on:
  push:
    branches:
      - research/classical-tamil-concept-matrix-r1.5a
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-research:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: "-p no:cacheprovider"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Regenerate preserved R0 layer
        run: python3 scripts/generate_research_layer.py --root .

      - name: Generate R1 review exports
        run: python3 scripts/generate_research_r1.py --root .

      - name: Generate R1.5 concept-matrix pilot
        run: python3 scripts/generate_research_r15.py --root .

      - name: Validate R0 compatibility invariants
        run: python3 scripts/validate_research_layer.py --root .

      - name: Validate R1 workflow
        run: >-
          python3 scripts/validate_research_r1.py --root .
          --output logs/classical-tamil-research-r1-validation-ci.json

      - name: Validate R1.5 pilot
        run: >-
          python3 scripts/validate_research_r15.py --root .
          --output logs/classical-tamil-research-r15-validation-ci.json

      - name: Validate R1.5 original acceptance boundary
        run: >-
          python3 scripts/validate_research_r15_acceptance.py --root .
          --output logs/classical-tamil-research-r15-acceptance-ci.json

      - name: Validate exact R1.5 29-dimension surface
        run: python3 scripts/validate_research_r15_dimensions.py --root .

      - name: Validate R1.5 pre-merge control audit
        run: >-
          python3 scripts/validate_r15_premerge_matrix_audit.py --root .
          --output logs/classical-tamil-r15-premerge-matrix-audit-ci.json

      - name: Validate R1.5A Purananuru production prefix
        run: python3 scripts/validate_r15_purananuru_production.py --root .

      - name: Validate R1.5A Tolkappiyam production prefix
        run: python3 scripts/validate_r15_tolkappiyam_production.py --root .

      - name: Run complete regression suite
        run: pytest -q

      - name: Verify R1 deterministic regeneration
        run: >-
          python3 scripts/verify_research_r1_idempotence.py --root .
          --output logs/classical-tamil-research-r1-idempotence-ci.json

      - name: Verify R1.5 deterministic regeneration
        run: >-
          python3 scripts/verify_research_r15_idempotence.py --root .
          --output logs/classical-tamil-research-r15-idempotence-ci.json

      - name: Capture R1.5 acceptance baseline
        run: >-
          python3 scripts/create_research_r15_baseline.py --root .
          --output logs/classical-tamil-research-r15-baseline-ci.json

      - name: Remove runtime caches before audit
        run: rm -rf .pytest_cache scripts/__pycache__ tests/__pycache__

      - name: Audit repository
        run: python3 scripts/audit_repository.py --root .

      - name: Prove Corpus 1.1.0 and Tolkappiyam are unchanged
        run: |
          git diff --exit-code classical-tamil-corpus-v1.1.0 -- corpus sources apparatus manifests/poems.csv manifests/records.csv
          git diff --exit-code classical-tamil-corpus-v1.1.0 -- corpus/tolkappiyam apparatus/tolkappiyam

      - name: Prove R1 primary histories remain unchanged by generators
        run: |
          git diff --exit-code HEAD -- research/evidence/purananuru/assertions.ndjson
          git diff --exit-code HEAD -- research/reviews/purananuru/review-events.ndjson
          git diff --exit-code HEAD -- research/entities/pilot/entity-resolution-decisions.ndjson
          git diff --exit-code HEAD -- research/relationships/pilot/relationships.ndjson
